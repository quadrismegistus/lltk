services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.10
    container_name: lltk-clickhouse
    ports:
      - "9000:9000"   # native TCP protocol
      - "8123:8123"   # HTTP interface (used by clickhouse-connect)
    volumes:
      # Bind-mount data + logs into ~/lltk_data so they live alongside other
      # LLTK artifacts (inspectable, backup-able, rsync-able). ClickHouse
      # stores a directory tree (data/, metadata/, store/, …) — not a single
      # file — so we mount a directory not a path ending in `.db`.
      - ${HOME}/lltk_data/data/clickhouse:/var/lib/clickhouse
      - ${HOME}/lltk_data/data/clickhouse-logs:/var/log/clickhouse-server
      # Mount LLTK corpora read-only so ClickHouse can query per-corpus
      # parquets directly via the `file()` table function.
      - ${HOME}/lltk_data/corpora:/lltk_corpora:ro
    environment:
      CLICKHOUSE_DB: lltk
      CLICKHOUSE_USER: lltk
      CLICKHOUSE_PASSWORD: lltk
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 3

