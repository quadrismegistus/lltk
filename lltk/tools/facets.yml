# facets.yml — canonical genre tag vocabulary for lltk.text_genre_tags
#
# Parsing algorithm (lltk.tools.genre_tags.normalize_genre_raw):
#   1. Split raw string on ';' or ' | ' → independent tag chunks
#   2. For each chunk: exact-match lookup in `atoms` first
#   3. If no exact match: split on first ',' → look up each part in `atoms`
#   4. Lowercase + strip each part before lookup
#   5. null atom values = skip (noise / redundant with genre vocab)
#   6. List atom values = decompose (e.g. "Historical fiction" → [historical, novel])
#
# Tag naming: lowercase-with-spaces. Multi-word terms that are critically
# established as a single genre are kept atomic (imaginary voyage, rogue fiction,
# criminal biography, tragical history, secret history, it-narrative).

# ── Canonical tag definitions ─────────────────────────────────────────────────

tags:

  # Form — what kind of narrative object
  novel:          {facets: [form]}
  romance:        {facets: [form]}
  tale:           {facets: [form]}
  novella:        {facets: [form]}
  fable:          {facets: [form]}
  allegory:       {facets: [form, register]}
  satire:         {facets: [form, register]}
  dialogue:       {facets: [form]}
  biography:      {facets: [form]}
  jestbook:       {facets: [form]}
  chapbook:       {facets: [form]}
  # verse intentionally omitted — duplicates genre=Poetry; use ballad/hymn/ode/etc.
  comedy:         {facets: [form]}
  tragedy:        {facets: [form]}
  tragicomedy:    {facets: [form]}
  opera:          {facets: [form]}
  drama:          {facets: [form]}
  masque:         {facets: [form]}
  interlude:      {facets: [form]}

  # Poetry subgenres
  ballad:         {facets: [form]}
  hymn:           {facets: [form]}
  ode:            {facets: [form]}
  epic:           {facets: [form]}
  sonnet:         {facets: [form]}
  elegy:          {facets: [form]}
  lyric:          {facets: [form]}

  # Compound critical terms — kept atomic, not decomposed; subgenre = specific
  # named form within a broader category (novel, biography, etc.)
  imaginary voyage:    {facets: [form, subgenre]}
  criminal biography:  {facets: [form, subgenre]}
  tragical history:    {facets: [form, subgenre]}
  secret history:      {facets: [form, subgenre]}
  rogue fiction:       {facets: [form, register, subgenre]}
  character writing:   {facets: [form, subgenre]}
  pamphlet fiction:    {facets: [form, subgenre]}
  hagiography:         {facets: [form, subgenre]}
  it-narrative:        {facets: [form, subgenre]}
  utopia:              {facets: [form, subgenre]}
  roman à clef:        {facets: [form, subgenre]}

  # Named subgenres (common enough to tag; treated as form for cross-facet queries)
  gothic:              {facets: [mode, register]}
  bildungsroman:       {facets: [form, subgenre]}

  # Mode / register — how it's written, what it does
  epistolary:     {facets: [mode]}
  picaresque:     {facets: [mode, register]}
  amatory:        {facets: [mode, register]}
  pastoral:       {facets: [mode, register]}
  heroic:         {facets: [mode, register]}
  chivalric:      {facets: [mode, register]}
  mock-chivalric: {facets: [mode, register]}
  historical:     {facets: [mode]}
  sentimental:    {facets: [mode, register]}
  gallant:        {facets: [mode, register]}
  didactic:       {facets: [mode, register]}
  classical:      {facets: [mode]}
  legendary:      {facets: [mode]}
  oriental:       {facets: [mode, register]}
  satirical:      {facets: [mode, register]}
  comic:          {facets: [mode, register]}
  religious:      {facets: [mode, register]}
  biblical:       {facets: [mode]}
  political:      {facets: [mode]}
  psychological:  {facets: [mode]}
  scandal:        {facets: [mode, register]}
  allegorical:    {facets: [mode, register]}


# ── Atom-level normalization ───────────────────────────────────────────────────
# Maps individual atoms (after splitting on ; / | / ,) to canonical tag(s).
# String → single canonical tag name
# String → list of canonical tag names (decompose)
# String → null (skip — noise or redundant with genre vocab)
#
# Case-insensitive lookup; strip whitespace before matching.

atoms:

